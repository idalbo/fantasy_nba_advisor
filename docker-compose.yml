services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  fantasy-nba:
    build: .
    ports:
      - "8504:8501"
    volumes:
      - ./data:/app/data
      - ./monitoring:/app/monitoring
      - ./.env:/app/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - qdrant
    restart: unless-stopped
    command: >
      sh -c "
        echo '🏀 Starting Fantasy NBA Advisor...' &&
        echo '⏳ Waiting for Qdrant to be ready...' &&
        sleep 10 &&
        echo '📊 Ingesting NBA data...' &&
        python -c 'import sys; sys.path.append(\"src\"); from data_ingestion import DataIngestion; DataIngestion().run_ingestion()' &&
        echo '🚀 Starting Streamlit app...' &&
        streamlit run app.py --server.address 0.0.0.0 --server.port 8501
      "

volumes:
  qdrant_storage: